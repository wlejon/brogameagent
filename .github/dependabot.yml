version: 2

# brogameagent pulls its siblings (bromath, brotensor) by source checkout, not
# from a package manager, and vendors nothing, so there is no manifest for
# Dependabot to bump. The only versioned things it can watch are the pinned
# actions in .github/workflows/.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [ci]
    commit-message:
      prefix: "ci"
    ignore:
      # GitHub maintains the `v4` major tag and ships security fixes to it, so
      # `@v4` is already patched without any PR. Pinning to an exact patch would
      # trade that automatic patching for a codeql-action PR in every repo on
      # each release. Major bumps (v4 -> v5) still come through.
      - dependency-name: "github/codeql-action"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
